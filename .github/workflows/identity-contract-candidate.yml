name: Identity Contract Candidate Artifacts

on:
  pull_request:
    paths:
      - ".github/workflows/identity-contract-candidate.yml"
      - ".node-version"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tools/contract-generation.ts"
      - "tools/generate-contracts.ts"
      - "packages/contracts/package.json"
      - "packages/contracts/buf.yaml"
      - "packages/contracts/buf.gen.yaml"
      - "packages/contracts/buf.lock"
      - "packages/contracts/proto/**"
      - "packages/contracts/gen/go/go.mod"
      - "packages/contracts/gen/go/go.sum"
  push:
    branches: [qualification/identity-contract-candidate-20261128]

permissions:
  contents: read

concurrency:
  group: identity-contract-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Generate reviewable contract candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1; fixed bootstrap
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          check-latest: false
          cache-dependency-path: packages/contracts/gen/go/go.sum
      - name: Install the exact dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned native contract generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.1
      - name: Generate and bind candidates to their source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(find packages/contracts/proto -type f -o -type l)" = packages/contracts/proto/identity/v1/identity.proto
          test ! -L packages/contracts/proto/identity/v1/identity.proto
          test ! -e packages/contracts/buf.lock
          candidate_dir="$RUNNER_TEMP/identity-contract-candidate"
          mkdir "$candidate_dir"
          digests() {
            sha256sum "$@" | jq -Rn '[inputs | capture("^(?<sha256>[0-9a-f]{64})  (?<path>.+)$")]'
          }
          digests \
            .github/workflows/identity-contract-candidate.yml \
            .node-version .npmrc package.json pnpm-lock.yaml pnpm-workspace.yaml \
            tools/contract-generation.ts tools/generate-contracts.ts \
            packages/contracts/package.json \
            packages/contracts/buf.yaml packages/contracts/buf.gen.yaml \
            packages/contracts/proto/identity/v1/identity.proto \
            packages/contracts/gen/go/go.mod packages/contracts/gen/go/go.sum \
            > "$RUNNER_TEMP/identity-contract-source-digests.json"
          pnpm contracts:generate
          (
            cd packages/contracts
            ../../node_modules/.bin/buf lint
            ../../node_modules/.bin/buf build --output "$candidate_dir/descriptor.bin"
          )
          for path in \
            packages/contracts/src/features/protocol/contracts/gen/identity/v1/identity_pb.ts \
            packages/contracts/gen/go/identity/v1/identity.pb.go \
            packages/contracts/gen/go/identity/v1/identityv1connect/identity.connect.go; do
            test -s "$path"
            install -D -m 0644 "$path" "$candidate_dir/$path"
          done
          test -s "$candidate_dir/descriptor.bin"
          (
            cd "$candidate_dir"
            digests \
              packages/contracts/src/features/protocol/contracts/gen/identity/v1/identity_pb.ts \
              packages/contracts/gen/go/identity/v1/identity.pb.go \
              packages/contracts/gen/go/identity/v1/identityv1connect/identity.connect.go \
              descriptor.bin
          ) > "$RUNNER_TEMP/identity-contract-candidate-digests.json"
          jq -n --arg sourceRevision "$SOURCE_REVISION" \
            --slurpfile sourceInputs "$RUNNER_TEMP/identity-contract-source-digests.json" \
            --slurpfile candidateArtifacts "$RUNNER_TEMP/identity-contract-candidate-digests.json" \
            '{schemaVersion: 1, sourceRevision: $sourceRevision, sourceInputs: $sourceInputs[0], candidateArtifacts: $candidateArtifacts[0], qualification: "candidate-generation-only"}' \
            > "$candidate_dir/manifest.json"
      - name: Preserve only declared contract candidates and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: identity-contract-candidate-${{ env.SOURCE_REVISION }}
          path: |
            ${{ runner.temp }}/identity-contract-candidate/packages/contracts/src/features/protocol/contracts/gen/identity/v1/identity_pb.ts
            ${{ runner.temp }}/identity-contract-candidate/packages/contracts/gen/go/identity/v1/identity.pb.go
            ${{ runner.temp }}/identity-contract-candidate/packages/contracts/gen/go/identity/v1/identityv1connect/identity.connect.go
            ${{ runner.temp }}/identity-contract-candidate/descriptor.bin
            ${{ runner.temp }}/identity-contract-candidate/manifest.json
          if-no-files-found: error
          retention-days: 7
