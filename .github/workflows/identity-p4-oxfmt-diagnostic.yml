name: Observe P4 pinned Oxfmt differences
on:
  push:
    branches: [qualification/identity-p4-oxfmt-20261128]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Report literal original-file formatting without writing source
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          stack="$(node -p 'require.resolve("stack-toolchain/package.json")')"
          fmt="$(node -p 'require("node:module").createRequire(process.argv[1]).resolve("oxfmt/package.json")' "$stack")"
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          for file in \
            architecture/foundation/source-dependencies.yaml \
            packages/identity/src/features/account/adapters/outbound/postgres-outbox.ts \
            packages/identity/src/features/account/application/ports/account-outbox.ts \
            packages/identity/src/features/account/application/use-cases/deliver-account-events.ts \
            packages/identity/tests/features/account/postgres-account.test.ts \
            packages/identity/tests/features/account/postgres-outbox.tests.ts \
            docs/README.md; do
            node "$(dirname "$fmt")/bin/oxfmt" --config "$(dirname "$stack")/presets/format.json" --disable-nested-config --stdin-filepath "$file" < "$file" > "$output"
            diff -u --label "$file" --label "$file.formatted" "$file" "$output" || test "$?" -eq 1
          done
